security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: auto
            # Lowest possible values, tests don't need strong hashing and it is slow.
            cost: 4
            time_cost: 3
            memory_cost: 10
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: forumify_chain_provider
            form_login:
                login_path: forumify_core_login
                check_path: forumify_core_login
                enable_csrf: true
            logout:
                path: forumify_core_logout
            login_throttling:
                # Effectively disabled, the limiter persists in the cache and would
                # otherwise start failing tests after repeated runs.
                max_attempts: 999999
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
            custom_authenticators:
                - Forumify\Core\Security\Http\Authenticator\ForumifyAuthenticator
    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
